[project]
name = "ytstep"
version = "0.1.0"
description = "Find the right YouTube videos for what you want to learn."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-adk>=2.14.0",
    "google-genai>=2.34.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    # Saved chats on Vercel (Postgres)
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    # Traces of every chat → Langfuse (only used when LANGFUSE_* keys are set)
    "langfuse>=5.2.0",
    "openinference-instrumentation-google-adk>=1.1.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

# Vercel runs the chat page + agents from frontend/server.py (not the root main.py).
[tool.vercel]
entrypoint = "frontend.server:app"

# Serve the chat page's files from Vercel's CDN even though the server has a
# middleware (the Gatekeeper, which only guards the API routes).
[tool.vercel.fastapi.static]
cdn = true
